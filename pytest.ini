[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --strict-config
markers =
    slow: integration test against the real 727 KB .gv file (deselect with -m "not slow")
filterwarnings =
    # pydot 4.0.1 still uses the deprecated pyparsing setParseAction API; this is
    # a third-party deprecation, not a problem in this codebase.
    ignore:.*setParseAction.*:DeprecationWarning
